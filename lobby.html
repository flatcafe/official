<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ふらっとcafe - Lobby</title>

    <style>
        /* =========================================
           1. 共通設定 & デザイン変数
           ========================================= */
        :root {
            --paper-bg: #fdfbf7;
            --wood-dark: #4a3b32;
            --accent-gold: #ffd54f;
            --pin-color: #e53935; 
            --cork-bg: #e6d6ac;
            --col-toruma: #ab47bc;
            --col-yuzu: #fbc02d;
            --col-wakanagi: #66bb6a;
            --col-lily: #ef5350;
        }

        * { -webkit-tap-highlight-color: transparent; outline: none; box-sizing: border-box; }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #1a1210;
            font-family: 'Georgia', 'Yu Mincho', serif;
            color: var(--wood-dark); overflow-x: hidden;
            background-image: url('https://www.transparenttextures.com/patterns/wood-pattern.png');
            background-attachment: fixed; transition: background-color 1.5s ease;
        }

        #lighting-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: -1; transition: background 2s ease; mix-blend-mode: overlay; }
        body.time-morning #lighting-overlay { background: linear-gradient(135deg, rgba(255, 255, 240, 0.3), rgba(200, 230, 255, 0.2)); }
        body.time-day #lighting-overlay { background: radial-gradient(circle at 50% 30%, rgba(255, 255, 255, 0.15), transparent 70%); }
        body.time-sunset #lighting-overlay { background: linear-gradient(to bottom right, rgba(255, 160, 0, 0.3), rgba(100, 50, 0, 0.4)); mix-blend-mode: soft-light; }
        body.time-night #lighting-overlay { background: radial-gradient(circle at 50% 50%, rgba(40, 50, 80, 0.2) 20%, rgba(0, 0, 10, 0.8) 100%); }

        .container { max-width: 900px; margin: 0 auto; padding: 20px 15px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        header { text-align: center; margin-bottom: 20px; flex-shrink: 0; position: relative; width: 100%; }
        .mini-logo { width: 120px; height: auto; margin-bottom: 10px; filter: drop-shadow(0 4px 8px rgba(0,0,0,0.6)); }
        .header-text { color: #fffbe0; letter-spacing: 0.2em; font-size: 1rem; text-shadow: 0 2px 4px rgba(0,0,0,0.8); border-top: 1px solid rgba(255,255,255,0.4); border-bottom: 1px solid rgba(255,255,255,0.4); padding: 3px 15px; display: inline-block; }
        #greeting-msg { font-size: 0.8rem; color: #fffbe0; margin-top: 5px; opacity: 0.8; }

        .card-grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 15px; width: 100%; margin-bottom: 20px; }
        .menu-tab { position: relative; background-color: #fffcf5; border-radius: 8px; color: var(--wood-dark); box-shadow: 0 4px 10px rgba(0,0,0,0.4); transition: all 0.2s ease; display: flex; flex-direction: column; align-items: center; justify-content: center; width: 160px; height: 140px; cursor: pointer; }
        .menu-tab.active-tab { transform: translateY(4px); box-shadow: 0 2px 5px rgba(0,0,0,0.4), 0 0 10px var(--accent-gold); border: 3px solid var(--accent-gold); }
        .tab-icon { font-size: 3rem; margin-bottom: 5px; }

        #content-display { width: 100%; flex-grow: 1; display: none; }
        #content-display.active { display: block; }
        .content-panel { background-color: var(--cork-bg); background-image: url('https://www.transparenttextures.com/patterns/cork-board.png'); border-radius: 8px; border: 8px solid #5d4037; box-shadow: 0 10px 30px rgba(0,0,0,0.6) inset; padding: 20px; position: relative; min-height: 400px; padding-bottom: 60px; }
        .section-view { display: none; }
        .section-view.show { display: block; }

        /* Members Stage */
        .members-stage { display: flex; justify-content: space-around; align-items: flex-end; height: 320px; position: relative; }
        .char-tachi { position: relative; width: 23%; height: 100%; cursor: pointer; transform-origin: bottom center; display: flex; justify-content: center; align-items: flex-end; transition: all 0.5s; }
        .char-tachi img { object-fit: contain; object-position: bottom center; max-width: 100%; max-height: 100%; }
        .char-tachi.dimmed { opacity: 0.5; filter: blur(2px) grayscale(0.5); }
        .char-tachi.active { transform: scale(1.2) translateY(20px); z-index: 100; }

        .char-bio-box { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); width: 95%; max-width: 400px; background: rgba(255, 252, 240, 0.95); border: 2px solid var(--wood-dark); border-radius: 12px; padding: 15px; opacity: 0; pointer-events: none; transition: all 0.4s; z-index: 200; }
        .char-bio-box.show { opacity: 1; pointer-events: auto; }
        .bio-btn { font-size: 0.8rem; padding: 4px 12px; background: #fff; border: 1px solid #ccc; border-radius: 15px; cursor: pointer; display: inline-block; }

        /* Curtain & Full View */
        #full-view-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; opacity: 0; visibility: hidden; transition: all 0.3s; }
        #full-view-modal.active { opacity: 1; visibility: visible; }
        #full-view-img { max-width: 90%; max-height: 70vh; object-fit: contain; z-index: 1000; }
        
        .curtain-left, .curtain-right {
            position: absolute; top: 0; width: 51%; height: 100%;
            background: #b71c1c; background-image: repeating-linear-gradient(90deg, transparent, transparent 40px, rgba(0,0,0,0.1) 40px, rgba(0,0,0,0.1) 80px);
            box-shadow: inset 0 0 50px rgba(0,0,0,0.5);
            transition: transform 0.8s cubic-bezier(0.25, 1, 0.5, 1);
            z-index: 5000; pointer-events: none;
        }
        .curtain-left { left: 0; transform: translateX(-100%); }
        .curtain-right { right: 0; transform: translateX(100%); }
        #full-view-modal.changing .curtain-left, #full-view-modal.changing .curtain-right { transform: translateX(0); }
        #full-view-modal.shaking .curtain-left, #full-view-modal.shaking .curtain-right { animation: curtain-wave 0.5s infinite; }

        .full-view-ctrl { margin-top: 20px; display: flex; gap: 10px; z-index: 10000; flex-wrap: wrap; justify-content: center; }
        .switch-btn { padding: 12px 20px; background: rgba(255,255,255,0.2); color: #fff; border: 1px solid #fff; border-radius: 30px; cursor: pointer; transition: 0.3s; min-width: 150px; text-align: center; }
        .switch-btn:hover { background: rgba(255,255,255,0.4); }
        .full-view-close { position: absolute; top: 20px; right: 20px; color: #fff; font-size: 2.5rem; cursor: pointer; z-index: 10000; }

        .close-btn { display: inline-block; padding: 8px 30px; background: #8d6e63; color: #fff; border-radius: 20px; cursor: pointer; }

        @keyframes curtain-wave { 0%, 100% { transform: scaleX(1); } 50% { transform: scaleX(1.03); } }
    </style>
</head>
<body class="time-day">
    <div id="lighting-overlay"></div>

    <div class="container">
        <header>
            <img src="flat-cafe-logo.png" alt="Flat Cafe" class="mini-logo">
            <br><span class="header-text">Select Menu</span>
            <div id="greeting-msg">いらっしゃいませ。</div>
        </header>

        <div class="card-grid">
            <div class="menu-tab" onclick="openTab('members', this)">
                <div class="tab-icon">☕</div><div class="tab-title">Members</div>
            </div>
            <div class="menu-tab" onclick="openTab('gallery', this)">
                <div class="tab-icon">📷</div><div class="tab-title">Gallery</div>
            </div>
        </div>

        <div id="content-display">
            <div class="content-panel">
                <div id="view-members" class="section-view">
                    <div class="members-stage">
                        <div class="char-tachi" id="tachi-toruma" onclick="selectMember('toruma', this, 'menu_youtube.png')"><img src="menu_youtube.png"></div>
                        <div class="char-tachi" id="tachi-yuzu" onclick="selectMember('yuzu', this, 'menu_twitter.png')"><img src="menu_twitter.png"></div>
                        <div class="char-tachi" id="tachi-wakanagi" onclick="selectMember('wakanagi', this, 'menu_member.png')"><img src="menu_member.png"></div>
                        <div class="char-tachi" id="tachi-lily" onclick="selectMember('lily', this, 'menu_gallery.png')"><img src="menu_gallery.png"></div>
                    </div>

                    <div class="char-bio-box" id="bio-toruma">
                        <div class="bio-header"><div class="bio-name">とるま</div></div>
                        <div class="bio-links"><div class="bio-btn">🔍 衣装を見る</div></div>
                    </div>
                    <div class="char-bio-box" id="bio-yuzu">
                        <div class="bio-header"><div class="bio-name">柚茶</div></div>
                        <div class="bio-links"><div class="bio-btn">🔍 衣装を見る</div></div>
                    </div>
                    <div class="char-bio-box" id="bio-wakanagi">
                        <div class="bio-header"><div class="bio-name">若凪</div></div>
                        <div class="bio-links"><div class="bio-btn">🔍 衣装を見る</div></div>
                    </div>
                    <div class="char-bio-box" id="bio-lily">
                        <div class="bio-header"><div class="bio-name">Lily00</div></div>
                        <div class="bio-links"><div class="bio-btn">🔍 衣装を見る</div></div>
                    </div>
                </div>

                <div class="panel-footer" style="text-align:center; margin-top:20px;">
                    <div class="close-btn" onclick="closeContent()">Close ×</div>
                </div>
            </div>
        </div>
    </div>

    <div id="full-view-modal">
        <div class="curtain-left"></div><div class="curtain-right"></div>
        <div class="full-view-close" onclick="closeFullView()">×</div>
        <img id="full-view-img" src="">
        <div class="full-view-ctrl">
            <div class="switch-btn" id="btn-halloween" onclick="switchSpecificOutfit('halloween')">🎃 ハロウィン</div>
            <div class="switch-btn" id="btn-cafe" onclick="switchSpecificOutfit('cafe')">☕ カフェスタイル</div>
            <div class="switch-btn" id="btn-default" onclick="switchSpecificOutfit('default')">👕 通常衣装へ</div>
        </div>
    </div>

    <script>
        let currentMember = "";
        let currentDefaultImg = "";

        // 衣装の定義（画像がない場合はボタンが出ません）
        const outfitLibrary = {
            'toruma': { halloween: 'toruma_halloween.png', cafe: 'toruma_cafe.png' },
            'yuzu': { halloween: 'yuzu_halloween.png', cafe: 'yuzu_cafe.png' },
            'wakanagi': { halloween: 'wakanagi_halloween.png', cafe: 'wakanagi_cafe.png' },
            'lily': { halloween: 'lily_halloween.png', cafe: 'lily_cafe.png' }
        };

        function updateTimeOfDay() {
            const hr = new Date().getHours();
            const msg = document.getElementById('greeting-msg');
            if(hr >= 5 && hr < 11) msg.textContent = "おはよう。";
            else if(hr >= 11 && hr < 17) msg.textContent = "こんにちは。";
            else msg.textContent = "こんばんは。";
        }
        window.onload = updateTimeOfDay;

        function openTab(name, elem) {
            document.getElementById('content-display').classList.add('active');
            document.querySelectorAll('.section-view').forEach(v => v.classList.remove('show'));
            document.getElementById('view-' + name).classList.add('show');
        }

        function closeContent() { document.getElementById('content-display').classList.remove('active'); }

        function selectMember(name, elem, imgSrc) {
            document.querySelectorAll('.char-tachi').forEach(c => { c.classList.remove('active'); c.classList.add('dimmed'); });
            elem.classList.remove('dimmed'); elem.classList.add('active');
            document.querySelectorAll('.char-bio-box').forEach(b => b.classList.remove('show'));
            const bio = document.getElementById('bio-' + name);
            if(bio) {
                bio.classList.add('show');
                bio.querySelector('.bio-btn').onclick = () => openFullView(imgSrc, name);
            }
        }

        function openFullView(imgSrc, name) {
            currentMember = name;
            currentDefaultImg = imgSrc;
            const modal = document.getElementById('full-view-modal');
            const img = document.getElementById('full-view-img');
            img.src = imgSrc;
            
            // ボタンの表示制御
            const lib = outfitLibrary[name] || {};
            document.getElementById('btn-halloween').style.display = lib.halloween ? 'block' : 'none';
            document.getElementById('btn-cafe').style.display = lib.cafe ? 'block' : 'none';

            modal.classList.remove('changing', 'shaking');
            modal.classList.add('active');
        }

        function switchSpecificOutfit(type) {
            const modal = document.getElementById('full-view-modal');
            const img = document.getElementById('full-view-img');
            const lib = outfitLibrary[currentMember] || {};
            
            let targetSrc = currentDefaultImg;
            if(type === 'halloween' && lib.halloween) targetSrc = lib.halloween;
            if(type === 'cafe' && lib.cafe) targetSrc = lib.cafe;

            if(img.src.includes(targetSrc)) return; // 同じ衣装なら何もしない

            modal.classList.add('changing');

            setTimeout(() => {
                modal.classList.add('shaking');
                img.src = targetSrc;

                setTimeout(() => {
                    modal.classList.remove('shaking');
                    setTimeout(() => {
                        modal.classList.remove('changing');
                    }, 100);
                }, 1500); // お着替え時間
            }, 600);
        }

        function closeFullView() { document.getElementById('full-view-modal').classList.remove('active'); }
    </script>
</body>
</html>
